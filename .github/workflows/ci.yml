name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security gates (SAST + secret scan + SCA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ── SAST ──────────────────────────────────────────────────────────
      # Semgrep CLI (SAST). Fails CI on any finding.
      - name: Install Semgrep
        run: pipx install semgrep
      - name: SAST (Semgrep)
        run: semgrep scan --config auto --error

      # ── Secret scan ───────────────────────────────────────────────────
      # Gitleaks scans committed changes / the repo for secrets. A real
      # finding fails CI. Allowlist lives in .gitleaks.toml (narrow only).
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── SCA (production dependency graph) ─────────────────────────────
      # npm audit --omit=dev enforces the release policy (0 critical / 0 high)
      # against the dependencies that actually ship. Uses the committed
      # lockfiles; no install needed.
      - name: SCA backend (npm audit --omit=dev)
        run: npm --prefix backend audit --omit=dev --audit-level=high
      - name: SCA frontend (npm audit --omit=dev)
        run: npm --prefix frontend audit --omit=dev --audit-level=high

  checks:
    name: Typecheck / build / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: looply_test
          POSTGRES_PASSWORD: looply_test_password
          POSTGRES_DB: looply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://looply_test:looply_test_password@127.0.0.1:5432/looply_test
      SEED_ADMIN_EMAIL: ci-admin@looply.test
      SEED_ADMIN_PASSWORD: ci-test-password-12345
      CORS_ORIGIN: http://localhost:5173
      PUBLIC_APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend (npm ci)
        run: npm --prefix backend ci
      - name: Install frontend (npm ci)
        run: npm --prefix frontend ci

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Prisma migrate deploy
        working-directory: backend
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Seed test database
        working-directory: backend
        run: npx tsx src/seed.ts

      - name: Typecheck
        run: |
          npm --prefix backend run typecheck
          npm --prefix frontend run typecheck
      - name: Build
        run: |
          npm --prefix backend run build
          npm --prefix frontend run build
      - name: Test
        run: |
          npm --prefix backend run test
          npm --prefix frontend run test
