# ==============================================================================
# SOURCE OF TRUTH TEMPLATE: looply.verbumlab.com.br.conf
# Target Host Location: /etc/nginx/sites-available/looply.verbumlab.com.br
#
# NOTE: Live configuration includes Certbot-managed SSL blocks.
# Initial provisioning requires Certbot:
#   sudo certbot --nginx -d looply.verbumlab.com.br
# ==============================================================================

server {
    server_name looply.verbumlab.com.br;

    root /srv/verbum/apps/looply/frontend;
    index index.html;
    autoindex off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Deny access to hidden files/directories (e.g. .env, .git)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Static assets with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Favicon and static files
    location = /favicon.svg {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # API reverse proxy to backend localhost:4000
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S3 / MinIO Object Storage reverse proxy for public presigned URLs
    location /looply-attachments/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Frontend SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- TLS Configuration (Provisioned on host via Certbot) ---
    # listen [::]:443 ssl ipv6only=on;
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/looply.verbumlab.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/looply.verbumlab.com.br/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

